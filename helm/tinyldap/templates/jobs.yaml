---
{{- $image := "ghcr.io/dreamtrack-net/tinyldap:2024-10-09" }}
{{- $b64_true := "dHJ1ZQo=" }}
{{- $b64_false := "ZmFsc2UK" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: create-init-flag
  annotations: "helm.sh/hook": "pre-install"
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: create-init-flag
          image: kubectl
          command:  # create initDone=false
            - /bin/sh
            - -c
            - |
              kubectl -n openldap-system apply -f - <<EOF
              apiVersion: v1
              kind: Secret
              metadata:
                name: init-flag
                namespace: openldap-system
              type: Opaque                
              data:
                initDone: {{ $b64_false }}
              EOF

---
apiVersion: batch/v1
kind: Job
metadata:
  name: slapd-bootstrap
  annotations: "helm.sh/hook": "post-install"  # if initDone = false, do init and set initDone = true
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: Never
      volumes:
      # configMaps.yaml
      - name: vol-tls-ldif
        configMap:
          name: cm-ldap-conf
          items:
          - key: tls.ldif
            path: tls.ldif
      # Thanks to https://vincentdeborger.be/blog/using-initcontainers-to-create-dependencies-on-pods
      # for this trick
      #initContainers:
      #  - name: wait-for-pod
      #    image: kubectl
      #    command:
      #      - /bin/sh
      #      - -c
      #      - |
      #        until kubectl -n openldap-system wait --for=condition=Ready pods -l app=openldap --timeout=300s; do
      #          sleep 5;
      #          echo 'Waiting for slapd...';
      #        done
      initContainers:
      - name: ldap-copy-meta
        image: {{ $image }}
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: vc-ldap-meta
          mountPath: /mnt
        command:
          - 'bash'
          - '-c'
          - 'tar cvpzf - /etc/ldap/slapd.d | tar xpzf - -C /mnt --strip-components=3'
      - name: ldap-copy-data
        image: {{ $image }}
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: openldap-pvc-data
          mountPath: /mnt
        command:
          - 'bash'
          - '-c'
          - 'tar cvpzf - /var/lib/ldap | tar xpzf - -C /mnt --strip-components=3'
      - name: openldap-configure-ldap
        image: {{ $image }}
        imagePullPolicy: Never
        volumeMounts:
        - name: openldap-pvc-meta
          mountPath: /etc/ldap/slapd.d
        - name: openldap-pvc-data
          mountPath: /var/lib/ldap
        - name: config-bash
          mountPath: /opt
        command:
          - 'bash'
          - '-c'
          - 'bash /opt/config.bash'

      #containers:
      #  - name: inject-tls
      #    image: {{ .Values.image }}
      #    volumeMounts:
      #    - name: tls-ldif
      #      mountPath: /opt
      #    env:
      #    - name: REPLICAS
      #      value: {{ .Values.replicas }}
      #    command:
      #      - |
      #        # apply /opt/tls.ldif to each replica --- tricky without working DNS
      #        ldapmodify -Y EXTERNAL -Hldapi:/// -Dcn=admin,cn=config ?????
      #  - name: pi
      #    image: perl:5.34.0
      #    command: ["perl",  "-Mbignum=bpi", "-wle", "print bpi(2000)"]

      containers:
        - name: create-init-flag
          image: kubectl
          command:  # create initDone=false
            - /bin/sh
            - -c
            - |
              kubectl -n openldap-system apply -f - <<EOF
              apiVersion: v1
              kind: Secret
              metadata:
                name: init-flag
                namespace: openldap-system
              type: Opaque                
              data:
                initDone: {{ $b64_true }}
              EOF
...
