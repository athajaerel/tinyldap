---
{{- $suffix := (concat (list "dc=") (list (($.Values.domain | splitList "." | join ",dc=") | join "")) | join "") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-ldap-conf
data:
  ldap.conf: |
    BASE {{ $suffix }}
    URI ldapi:///
    SIZELIMIT 50
    TIMELIMIT 10
    DEREF never

  config.bash: |
    #!/bin/bash
    set -euxo pipefail
    
    CONF='/etc/ldap/slapd.d/cn=config/olcDatabase={1}mdb.ldif'
    
    # not the preferred way --- but it's too hard otherwise
    # two threads in a pod seems to be more than we can manage...
    # $1: search key
    # $2: new value
    conf_replace() {
    	sed -i -e "s;^$1: .*$;$1: $2;" ${CONF}
    }
    
    # Just enough to bootstrap the database so we can log in as root DN
    RPWH64=$(<<<"{{ $.Values.olcAdmin.rootPwHash }}" base64)
    conf_replace "olcSuffix" "{{ $suffix }}"
    conf_replace "olcRootDN" "cn={{ $.Values.olcAdmin.rootRdn }},{{ $suffix }}"
    conf_replace "olcRootPW:" "${RPWH64}"
    RULE='to * by dn.base="gidNumber=0+uidNumber=0,cn=peercred,cn=external,cn=auth" manage'
    #sed -i -e "/^olcAccess:.{2}.*$/aolcAccess: {3}${RULE}" ${CONF}
    sed -i -e "/^olcAccess:.*$/d" ${CONF}
    # TODO: make access rules configurable properly in values.yaml
    sed -i -e "/^olcSuffix:.*$/aolcAccess: {0}${RULE}" ${CONF}
    
    CRC32=$(grep -v ^# ${CONF} | gzip -1 -c | tail -c8 | od -t x4 -N 4 -A n)
    sed -i -e "s;^# CRC32 .*$;# CRC32${CRC32};" ${CONF}
    
    CONF='/etc/ldap/slapd.d/cn=config/olcDatabase={0}config.ldif'
    sed -i -e "s/olcRootDN: cn=admin,cn=config/&\nolcRootPW:: ${RPWH64}/" ${CONF}
    
    CRC32=$(grep -v ^# ${CONF} | gzip -1 -c | tail -c8 | od -t x4 -N 4 -A n)
    sed -i -e "s;^# CRC32 .*$;# CRC32${CRC32};" ${CONF}

  tls.ldif: |
    dn: cn=config
    changetype: modify
    add: olcTLSCACertificateFile
    olcTLSCACertificateFile: /etc/tls/ca.crt
    
    dn: cn=config
    changetype: modify
    add: olcTLSCertificateKeyFile
    olcTLSCertificateKeyFile: /etc/tls/tls.key
    
    dn: cn=config
    changetype: modify
    add: olcTLSCertificateFile
    olcTLSCertificateFile: /etc/tls/tls.crt
...
# vim: set filetype=yaml
