---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ldap-cert
spec:
  secretName: ldap-tls
  dnsNames:
    - {{ $.Values.olcTLS.dnsNamePrefix }}.{{ $.Values.domain }}
{{- range untilStep 0 (int $.Values.replicas) 1 }}
    - {{ $.Values.olcTLS.dnsNamePrefix }}-{{ . }}.{{ $.Values.domain }}
{{- end }}
  issuerRef:
    name: {{ $.Values.olcTLS.clusterIssuerName }}
    kind: ClusterIssuer
...
# vim: set filetype=yaml
