---
# this is the headless service used by the statefulset
apiVersion: v1
kind: Service
metadata:
  name: ldap-svc-ss
spec:
  ipFamilies:
  - IPv4
  ipFamilyPolicy: 'SingleStack'
  ports:
    - name: ldap
      port: 389
      protocol: TCP
      targetPort: 10389
    - name: ldaps
      port: 636
      protocol: TCP
      targetPort: 10636
  publishNotReadyAddresses: false
  selector:
    app: ldap
  type: ClusterIP
  clusterIP: None

# these are extra services to expose the headless service
{{ range untilStep 0 (int $.Values.replicas) 1 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ldap-svc-{{ . }}
  labels:
    type: lb
spec:
  type: LoadBalancer
  selector:
    statefulset.kubernetes.io/pod-name: ldap-{{ . }}
  ports:
    - name: ldap
      port: 389
      protocol: TCP
      targetPort: 10389
    - name: ldaps
      port: 636
      protocol: TCP
      targetPort: 10636
  publishNotReadyAddresses: false
{{- end }}
...
